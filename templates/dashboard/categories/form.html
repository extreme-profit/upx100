{% extends 'dashboard/base.html' %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <div class="card-header">
        <h3 class="card-title">{{ title }}</h3>
        <a href="{% url 'dashboard:category_list' %}" class="btn btn-secondary">← Назад</a>
    </div>
    
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Название категории *</label>
                <input type="text" name="name" class="form-control" value="{{ category.name|default:'' }}" required placeholder="Например: Красота">
            </div>
            
            <div class="form-group">
                <label class="form-label">Слаг (URL) *</label>
                <input type="text" name="slug" class="form-control" value="{{ category.slug|default:'' }}" required placeholder="Например: krasota">
                <small style="color: #64748b; margin-top: 4px; display: block;">Латинские буквы, цифры и дефисы</small>
            </div>
            
            <div class="form-group">
                <label class="form-label">Иконка</label>
                {% if category.icon %}
                <div style="margin-bottom: 12px;">
                    <img src="{{ category.icon.url }}" alt="{{ category.name }}" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px;">
                </div>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="clear_icon"> Удалить текущую иконку
                </label>
                {% endif %}
                <input type="file" name="icon" class="form-control" accept="image/*">
            </div>
            
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'dashboard:category_list' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
