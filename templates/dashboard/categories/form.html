{% extends 'dashboard/base.html' %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <div class="card-header">
        <h3 class="card-title">{{ title }}</h3>
        <a href="{% url 'dashboard:category_list' %}" class="btn btn-secondary">← Назад</a>
    </div>
    
    <div class="card-body">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Название категории *</label>
                <input type="text" name="name" class="form-control" value="{{ category.name|default:'' }}" required placeholder="Например: Красота">
            </div>
            
            <div class="form-group">
                <label class="form-label">Слаг (URL) *</label>
                <input type="text" name="slug" id="category-slug" class="form-control" value="{{ category.slug|default:'' }}" required placeholder="Например: krasota">
                <small style="color: #737373; margin-top: 4px; display: block;">Латинские буквы, цифры и дефисы</small>
            </div>
            
            <div class="form-group">
                <label class="form-label">Иконка</label>
                {% if category.icon %}
                <div style="margin-bottom: 12px;">
                    <img src="{{ category.icon.url }}" alt="{{ category.name }}" style="width: 64px; height: 64px; object-fit: cover; border-radius: 8px;">
                </div>
                <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                    <input type="checkbox" name="clear_icon"> Удалить текущую иконку
                </label>
                {% endif %}
                <input type="file" name="icon" class="form-control" accept="image/*">
            </div>
            
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'dashboard:category_list' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Функция транслитерации
    function transliterateToSlug(text) {
        const translitMap = {
            'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd',
            'е': 'e', 'ё': 'yo', 'ж': 'zh', 'з': 'z', 'и': 'i',
            'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n',
            'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't',
            'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'ts', 'ч': 'ch',
            'ш': 'sh', 'щ': 'sch', 'ъ': '', 'ы': 'y', 'ь': '',
            'э': 'e', 'ю': 'yu', 'я': 'ya'
        };
        
        let slug = '';
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            slug += translitMap[char.toLowerCase()] || char;
        }
        
        slug = slug.toLowerCase();
        slug = slug.replace(/[^a-z0-9-]/g, '-');
        slug = slug.replace(/-+/g, '-');
        slug = slug.replace(/^-|-$/g, '');
        
        return slug;
    }
    
    // Автоматическое заполнение slug при вводе названия категории
    document.addEventListener('DOMContentLoaded', function() {
        const nameInput = document.querySelector('input[name="name"]');
        const slugInput = document.getElementById('category-slug');
        let userEditedSlug = false;
        
        if (nameInput && slugInput) {
            // Отслеживаем, редактировал ли пользователь slug вручную
            slugInput.addEventListener('input', function() {
                userEditedSlug = true;
            });
            
            nameInput.addEventListener('input', function() {
                // Автозаполняем slug только если пользователь не редактировал его вручную
                // или если поле slug было пустым изначально
                if (!userEditedSlug || slugInput.value === '') {
                    slugInput.value = transliterateToSlug(nameInput.value);
                }
            });
        }
    });
</script>
{% endblock %}
