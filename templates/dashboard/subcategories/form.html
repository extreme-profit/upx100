{% extends 'dashboard/base.html' %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <div class="card-header">
        <h3 class="card-title">{{ title }}</h3>
        <a href="{% url 'dashboard:subcategory_list' %}" class="btn btn-secondary">← Назад</a>
    </div>
    
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Категория *</label>
                <select name="category" class="form-control" required>
                    <option value="">Выберите категорию</option>
                    {% for cat in categories %}
                    <option value="{{ cat.pk }}" 
                        {% if subcategory.category.pk == cat.pk %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Название подкатегории *</label>
                <input type="text" name="name" class="form-control" value="{{ subcategory.name|default:'' }}" required placeholder="Например: Услуги парикмахера">
            </div>
            
            <div class="form-group">
                <label class="form-label">Слаг (URL) *</label>
                <input type="text" name="slug" class="form-control" value="{{ subcategory.slug|default:'' }}" required placeholder="Например: parikmaher">
                <small style="color: #64748b; margin-top: 4px; display: block;">Латинские буквы, цифры и дефисы</small>
            </div>
            
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'dashboard:subcategory_list' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
