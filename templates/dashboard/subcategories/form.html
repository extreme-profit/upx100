{% extends 'dashboard/base.html' %}

{% block content %}
<div class="card" style="max-width: 600px;">
    <div class="card-header">
        <h3 class="card-title">{{ title }}</h3>
        <a href="{% url 'dashboard:subcategory_list' %}" class="btn btn-secondary">← Назад</a>
    </div>
    
    <div class="card-body">
        <form method="post">
            {% csrf_token %}
            
            <div class="form-group">
                <label class="form-label">Категория *</label>
                <select name="category" class="form-control" required>
                    <option value="">Выберите категорию</option>
                    {% for cat in categories %}
                    <option value="{{ cat.pk }}" 
                        {% if subcategory.category.pk == cat.pk %}selected{% endif %}>
                        {{ cat.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label">Название подкатегории *</label>
                <input type="text" name="name" class="form-control" value="{{ subcategory.name|default:'' }}" required placeholder="Например: Услуги парикмахера">
            </div>
            
            <div class="form-group">
                <label class="form-label">Слаг (URL) *</label>
                <input type="text" name="slug" id="subcategory-slug" class="form-control" value="{{ subcategory.slug|default:'' }}" required placeholder="Например: parikmaher">
                <small style="color: #64748b; margin-top: 4px; display: block;">Латинские буквы, цифры и дефисы</small>
            </div>
            
            <div style="display: flex; gap: 12px; margin-top: 24px;">
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'dashboard:subcategory_list' %}" class="btn btn-secondary">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // Функция транслитерации
    function transliterateToSlug(text) {
        const translitMap = {
            'а': 'a', 'б': 'b', 'в': 'v', 'г': 'g', 'д': 'd',
            'е': 'e', 'ё': 'yo', 'ж': 'zh', 'з': 'z', 'и': 'i',
            'й': 'y', 'к': 'k', 'л': 'l', 'м': 'm', 'н': 'n',
            'о': 'o', 'п': 'p', 'р': 'r', 'с': 's', 'т': 't',
            'у': 'u', 'ф': 'f', 'х': 'h', 'ц': 'ts', 'ч': 'ch',
            'ш': 'sh', 'щ': 'sch', 'ъ': '', 'ы': 'y', 'ь': '',
            'э': 'e', 'ю': 'yu', 'я': 'ya'
        };
        
        let slug = '';
        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            slug += translitMap[char.toLowerCase()] || char;
        }
        
        slug = slug.toLowerCase();
        slug = slug.replace(/[^a-z0-9-]/g, '-');
        slug = slug.replace(/-+/g, '-');
        slug = slug.replace(/^-|-$/g, '');
        
        return slug;
    }
    
    // Автоматическое заполнение slug при вводе названия подкатегории
    document.addEventListener('DOMContentLoaded', function() {
        const nameInput = document.querySelector('input[name="name"]');
        const slugInput = document.getElementById('subcategory-slug');
        let userEditedSlug = false;
        
        if (nameInput && slugInput) {
            // Отслеживаем, редактировал ли пользователь slug вручную
            slugInput.addEventListener('input', function() {
                userEditedSlug = true;
            });
            
            nameInput.addEventListener('input', function() {
                // Автозаполняем slug только если пользователь не редактировал его вручную
                // или если поле slug было пустым изначально
                if (!userEditedSlug || slugInput.value === '') {
                    slugInput.value = transliterateToSlug(nameInput.value);
                }
            });
        }
    });
</script>
{% endblock %}
